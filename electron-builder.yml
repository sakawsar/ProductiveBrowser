appId: com.productivebrowser.app
productName: Productive Browser
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# The service runs the app's own executable in Node mode, so its script lives outside the asar.
asarUnpack:
  - out/main/**
win:
  target: nsis
  extraResources:
    - from: build/winsw
      to: winsw
      filter:
        - ProductiveBrowserService.exe
        - ProductiveBrowserService.xml
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  include: build/installer.nsh
mac:
  # A .pkg (not a .dmg) because installing the LaunchDaemon needs root.
  target:
    - target: pkg
      arch: universal
  category: public.app-category.productivity
  hardenedRuntime: true
  extraResources:
    - from: build/mac
      to: mac
pkg:
  installLocation: /Applications
  # Always install to /Applications, where the LaunchDaemon expects the app.
  isRelocatable: false
  scripts: pkg-scripts
